version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      LITELLM_UPSTREAM_MODEL: "openai/${LLM_MODEL:-your-model-id}"
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:8001/v1}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-local-dev-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: [ "--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000" ]

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - claim_uploads:/app/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - qdrant
      - redis
      - litellm

  celery-worker:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - claim_uploads:/app/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - postgres
      - backend

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  claim_uploads:
  model_cache:
